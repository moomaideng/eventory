name: eventory-production

x-migrate: &migrate
  restart: "no"
  healthcheck:
    disable: true
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: account_db,tournament_db,payment_db,notification_db
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')",
          "-u",
          "admin",
          "-p",
          "${MONGO_PASSWORD:?MONGO_PASSWORD is required}",
          "--authenticationDatabase",
          "admin",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: eventory
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Run as the rabbitmq user: a root-run check on a fresh volume creates a
      # root-owned .erlang.cookie before the server does, and the server then
      # crashes with eacces.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.12
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=eventory-production_default
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Gateway span is the trace root and forwards traceparent to services.
      - --tracing=true
      - --tracing.serviceName=traefik
      - --tracing.otlp.http=true
      - --tracing.otlp.http.endpoint=http://alloy:4318/v1/traces
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      - eventory.logs=true

  loki:
    image: grafana/loki:3.6.18
    mem_limit: 512m
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./docker/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0
    mem_limit: 512m
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./docker/observability/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.0
    mem_limit: 512m
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_SERVER_ROOT_URL: https://eventory.ddns.net/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    labels:
      - traefik.enable=true
      - traefik.docker.network=eventory-production_default
      - traefik.http.routers.grafana.rule=Host(`eventory.ddns.net`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=websecure
      # Don't trace Grafana's own UI traffic through the gateway.
      - traefik.http.routers.grafana.observability.tracing=false
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.priority=100
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  account-migrate:
    <<: *migrate
    image: ghcr.io/moomaideng/eventory-account:${ACCOUNT_IMAGE_TAG:?ACCOUNT_IMAGE_TAG is required}
    command: ["./migrate"]
    environment:
      ENVIRONMENT: production
      HTTP_PORT: "8081"
      GRPC_PORT: "9091"
      DB_DSN: postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/account_db?sslmode=disable

  account:
    image: ghcr.io/moomaideng/eventory-account:${ACCOUNT_IMAGE_TAG:?ACCOUNT_IMAGE_TAG is required}
    environment:
      ENVIRONMENT: production
      HTTP_PORT: "8081"
      GRPC_PORT: "9091"
      DB_DSN: postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/account_db?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8081/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - eventory.logs=true
      - traefik.enable=true
      - traefik.docker.network=eventory-production_default
      - traefik.http.routers.account.rule=Host(`eventory.ddns.net`) && PathPrefix(`/api/v1/accounts`)
      - traefik.http.routers.account.entrypoints=websecure
      - traefik.http.routers.account.tls=true
      - traefik.http.routers.account.tls.certresolver=letsencrypt
      - traefik.http.routers.account.priority=100
      - traefik.http.routers.account-internal.rule=Host(`traefik`) && PathPrefix(`/api/v1/accounts`)
      - traefik.http.routers.account-internal.entrypoints=web
      - traefik.http.routers.account-internal.service=account
      - traefik.http.routers.account-health.rule=Host(`eventory.ddns.net`) && Path(`/health`)
      - traefik.http.routers.account-health.entrypoints=websecure
      - traefik.http.routers.account-health.tls=true
      - traefik.http.routers.account-health.tls.certresolver=letsencrypt
      - traefik.http.routers.account-health.priority=100
      - traefik.http.routers.account-health.service=account
      - traefik.http.routers.account-health-internal.rule=Host(`traefik`) && Path(`/health`)
      - traefik.http.routers.account-health-internal.entrypoints=web
      - traefik.http.routers.account-health-internal.service=account
      - traefik.http.services.account.loadbalancer.server.port=8081
    restart: unless-stopped

  tournament-migrate:
    <<: *migrate
    image: ghcr.io/moomaideng/eventory-tournament:${TOURNAMENT_IMAGE_TAG:?TOURNAMENT_IMAGE_TAG is required}
    command: ["./migrate"]
    environment:
      ENVIRONMENT: production
      HTTP_PORT: "8082"
      DB_DSN: postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tournament_db?sslmode=disable
      ACCOUNT_GRPC_ADDR: account:9091
      PAYMENT_URL: http://payment:8083
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:?PAYMENT_SERVICE_KEY is required}

  tournament:
    image: ghcr.io/moomaideng/eventory-tournament:${TOURNAMENT_IMAGE_TAG:?TOURNAMENT_IMAGE_TAG is required}
    environment:
      ENVIRONMENT: production
      HTTP_PORT: "8082"
      DB_DSN: postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tournament_db?sslmode=disable
      ACCOUNT_GRPC_ADDR: account:9091
      PAYMENT_URL: http://payment:8083
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:?PAYMENT_SERVICE_KEY is required}
      MONGO_URI: mongodb://admin:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongodb:27017/tournament_db?authSource=admin
      MONGO_DB_NAME: tournament_db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8082/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      account:
        condition: service_healthy
    labels:
      - eventory.logs=true
      - traefik.enable=true
      - traefik.docker.network=eventory-production_default
      - traefik.http.routers.tournament.rule=Host(`eventory.ddns.net`) && (PathPrefix(`/api/v1/tournaments`) || PathPrefix(`/api/v1/lobbies`))
      - traefik.http.routers.tournament.entrypoints=websecure
      - traefik.http.routers.tournament.tls=true
      - traefik.http.routers.tournament.tls.certresolver=letsencrypt
      - traefik.http.routers.tournament.priority=100
      - traefik.http.routers.tournament-internal.rule=Host(`traefik`) && (PathPrefix(`/api/v1/tournaments`) || PathPrefix(`/api/v1/lobbies`))
      - traefik.http.routers.tournament-internal.entrypoints=web
      - traefik.http.routers.tournament-internal.service=tournament
      - traefik.http.services.tournament.loadbalancer.server.port=8082
    restart: unless-stopped

  payment-migrate:
    <<: *migrate
    image: ghcr.io/moomaideng/eventory-payment:${PAYMENT_IMAGE_TAG:?PAYMENT_IMAGE_TAG is required}
    command: ["./migrate"]
    environment:
      ENVIRONMENT: production
      HTTP_PORT: "8083"
      DB_DSN: postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/payment_db?sslmode=disable
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:?PAYMENT_SERVICE_KEY is required}

  payment:
    image: ghcr.io/moomaideng/eventory-payment:${PAYMENT_IMAGE_TAG:?PAYMENT_IMAGE_TAG is required}
    environment:
      ENVIRONMENT: production
      HTTP_PORT: "8083"
      DB_DSN: postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/payment_db?sslmode=disable
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:?PAYMENT_SERVICE_KEY is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8083/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - eventory.logs=true
      - traefik.enable=true
      - traefik.docker.network=eventory-production_default
      - traefik.http.routers.payment.rule=Host(`eventory.ddns.net`) && PathPrefix(`/api/v1/payments`)
      - traefik.http.routers.payment.entrypoints=websecure
      - traefik.http.routers.payment.tls=true
      - traefik.http.routers.payment.tls.certresolver=letsencrypt
      - traefik.http.routers.payment.priority=100
      - traefik.http.routers.payment-internal.rule=Host(`traefik`) && PathPrefix(`/api/v1/payments`)
      - traefik.http.routers.payment-internal.entrypoints=web
      - traefik.http.routers.payment-internal.service=payment
      - traefik.http.services.payment.loadbalancer.server.port=8083
    restart: unless-stopped

  notification-migrate:
    <<: *migrate
    image: ghcr.io/moomaideng/eventory-notification:${NOTIFICATION_IMAGE_TAG:?NOTIFICATION_IMAGE_TAG is required}
    command: ["./migrate"]
    environment:
      ENVIRONMENT: production
      DB_DSN: postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/notification_db?sslmode=disable

  notification:
    image: ghcr.io/moomaideng/eventory-notification:${NOTIFICATION_IMAGE_TAG:?NOTIFICATION_IMAGE_TAG is required}
    environment:
      ENVIRONMENT: production
      HTTP_PORT: "8084"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      DB_DSN: postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/notification_db?sslmode=disable
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_USERNAME: eventory
      AMQP_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS is required}
      SMTP_FROM_NAME: Eventory
      SMTP_STARTTLS: "true"
      SMTP_TIMEOUT: "10s"
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL is required}
      RETRY_DELAYS: 30s,5m,30m
      CONSUMER_PREFETCH: "1"
      PROCESSING_LEASE: "20s"
      BROKER_RECONNECT_DELAY: "5s"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8084/ready",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      - eventory.logs=true

  frontend:
    image: ghcr.io/moomaideng/eventory-frontend:${FRONTEND_IMAGE_TAG:?FRONTEND_IMAGE_TAG is required}
    environment:
      INTERNAL_API_URL: http://traefik:80
    depends_on:
      traefik:
        condition: service_healthy
      account:
        condition: service_healthy
      tournament:
        condition: service_healthy
      payment:
        condition: service_healthy
    labels:
      - eventory.logs=true
      - traefik.enable=true
      - traefik.docker.network=eventory-production_default
      - traefik.http.routers.frontend.rule=Host(`eventory.ddns.net`) && PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend.priority=1
      - traefik.http.routers.frontend.service=frontend
      - traefik.http.routers.frontend-http.rule=Host(`eventory.ddns.net`)
      - traefik.http.routers.frontend-http.entrypoints=web
      - traefik.http.routers.frontend-http.middlewares=redirect-https
      - traefik.http.routers.frontend-http.service=frontend
      - traefik.http.middlewares.redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-https.redirectscheme.permanent=true
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    restart: unless-stopped

networks:
  default:
    name: eventory-production_default

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
  traefik_letsencrypt:
  loki_data:
  tempo_data:
  grafana_data:
