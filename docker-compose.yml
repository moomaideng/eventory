name: eventory

x-backend-dev: &backend-dev
  build:
    context: ./backend
    dockerfile: docker/go-dev.Dockerfile
  volumes:
    - ./backend:/app
    - go_mod_cache:/go/pkg/mod
    - go_build_cache:/root/.cache/go-build
  working_dir: /app

services:
  postgres:
    image: postgres:18-alpine
    profiles: [infra]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: account_db,tournament_db,payment_db,notification_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:7.0
    profiles: [infra]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password123}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_USER:-admin}", "-p", "${MONGO_PASSWORD:-password123}", "--authenticationDatabase", "admin"]
      interval: 1s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [infra]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eventory}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eventory}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1
    profiles: [infra]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  traefik:
    image: traefik:v3.7.12
    profiles: [infra]
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=eventory_default
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1s
      timeout: 5s
      retries: 30

  account-migrate:
    <<: *backend-dev
    profiles: [apps]
    entrypoint: ["go", "run", "./services/account/cmd/migrate"]
    environment:
      ENVIRONMENT: development
      DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/account_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  account:
    <<: *backend-dev
    profiles: [apps]
    environment:
      SERVICE: account
      ENVIRONMENT: development
      DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/account_db?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9091:9091"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8081/health",
        ]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      account-migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.docker.network=eventory_default
      - traefik.http.routers.account.rule=PathPrefix(`/api/v1/accounts`)
      - traefik.http.routers.account.entrypoints=web
      - traefik.http.routers.account-health.rule=Path(`/health`)
      - traefik.http.routers.account-health.entrypoints=web
      - traefik.http.routers.account-health.service=account
      - traefik.http.services.account.loadbalancer.server.port=8081

  tournament-migrate:
    <<: *backend-dev
    profiles: [apps]
    entrypoint: ["go", "run", "./services/tournament/cmd/migrate"]
    environment:
      ENVIRONMENT: development
      DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/tournament_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  tournament:
    <<: *backend-dev
    profiles: [apps]
    environment:
      SERVICE: tournament
      ENVIRONMENT: development
      DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/tournament_db?sslmode=disable
      ACCOUNT_GRPC_ADDR: account:9091
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password123}@mongodb:27017/tournament_db?authSource=admin
      MONGO_DB_NAME: tournament_db
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8082/health",
        ]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      tournament-migrate:
        condition: service_completed_successfully
      account:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=eventory_default
      - traefik.http.routers.tournament.rule=PathPrefix(`/api/v1/tournaments`) || PathPrefix(`/api/v1/lobbies`)
      - traefik.http.routers.tournament.entrypoints=web
      - traefik.http.services.tournament.loadbalancer.server.port=8082

  payment-migrate:
    <<: *backend-dev
    profiles: [apps]
    entrypoint: ["go", "run", "./services/payment/cmd/migrate"]
    environment:
      ENVIRONMENT: development
      DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/payment_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  payment:
    <<: *backend-dev
    profiles: [apps]
    environment:
      SERVICE: payment
      ENVIRONMENT: development
      DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/payment_db?sslmode=disable
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:-local-payment-service-key-not-for-production}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8083/health"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      payment-migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.docker.network=eventory_default
      - traefik.http.routers.payment.rule=PathPrefix(`/api/v1/payments`)
      - traefik.http.routers.payment.entrypoints=web
      - traefik.http.services.payment.loadbalancer.server.port=8083

  notification-migrate:
    <<: *backend-dev
    profiles: [apps]
    entrypoint: ["go", "run", "./services/notification/cmd/migrate"]
    environment:
      ENVIRONMENT: development
      DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/notification_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  notification:
    <<: *backend-dev
    profiles: [apps]
    environment:
      SERVICE: notification
      ENVIRONMENT: development
      HTTP_PORT: "8084"
      DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/notification_db?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_USER:-eventory}:${RABBITMQ_PASSWORD:-eventory}@rabbitmq:5672/
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      PUBLIC_WEB_URL: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:8084/ready",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      notification-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: eventory-frontend:local
    profiles: [web]
    build:
      context: ./frontend
      target: development
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      INTERNAL_API_URL: http://traefik:80
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      traefik:
        condition: service_healthy
      account:
        condition: service_healthy
      tournament:
        condition: service_healthy
      payment:
        condition: service_healthy

networks:
  default:
    name: eventory_default

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
  go_mod_cache:
  go_build_cache:
  frontend_node_modules:
  frontend_next:
