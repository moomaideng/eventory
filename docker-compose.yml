name: eventory

services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    command: ["./migrate"]
    env_file:
      - ./backend/.env
    environment:
      DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: eventory-backend:local
    build:
      context: ./backend
      target: development
    command:
      - air
      - -c
      - .air.toml
      - --tmp_dir
      - tmp
      - --build.cmd
      - go build -o ./tmp/main ./cmd/api
      - --build.bin
      - ./tmp/main
      - --build.entrypoint
      - ./tmp/main
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
      PORT: "8080"
      DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/src
      - backend-air-tmp:/src/tmp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: eventory-frontend:local
    build:
      context: ./frontend
      target: development
    env_file:
      - ./frontend/.env.local
    environment:
      INTERNAL_API_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  backend-air-tmp:
  frontend-node-modules:
  frontend-next:
