name: CI and publish images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test and build backend
        working-directory: backend
        run: |
          go test -v ./...
          go build -o bin/api ./cmd/api

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/moomaideng/eventory-backend:latest
            ghcr.io/moomaideng/eventory-backend:${{ github.sha }}

      - name: Check frontend production configuration
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          test -n "$PROD_SUPABASE_URL" || (echo "::error::Missing PROD_SUPABASE_URL" && exit 1)
          test -n "$PROD_SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Missing PROD_SUPABASE_PUBLISHABLE_KEY" && exit 1)
          test -n "$PROD_API_URL" || (echo "::error::Missing PROD_API_URL" && exit 1)

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
          tags: |
            ghcr.io/moomaideng/eventory-frontend:latest
            ghcr.io/moomaideng/eventory-frontend:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          PROD_DB_DSN: ${{ secrets.PROD_DB_DSN }}
        run: |
          test -n "$ORACLE_HOST" || (echo "::error::Missing ORACLE_HOST" && exit 1)
          test -n "$ORACLE_USER" || (echo "::error::Missing ORACLE_USER" && exit 1)
          test -n "$ORACLE_SSH_KEY" || (echo "::error::Missing ORACLE_SSH_KEY" && exit 1)
          test -n "$ORACLE_KNOWN_HOSTS" || (echo "::error::Missing ORACLE_KNOWN_HOSTS" && exit 1)
          test -n "$PROD_DB_DSN" || (echo "::error::Missing PROD_DB_DSN" && exit 1)

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy production Compose configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" 'sudo install -d -m 0755 -o "$USER" -g "$(id -gn)" /opt/eventory'
          scp docker-compose.production.yml "$ORACLE_USER@$ORACLE_HOST:/opt/eventory/docker-compose.yml"

      - name: Write production runtime environment
        env:
          IMAGE_TAG: ${{ github.sha }}
          PROD_DB_DSN: ${{ secrets.PROD_DB_DSN }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'DB_DSN=%s\n' "$PROD_DB_DSN"
            printf 'SUPABASE_URL=%s\n' "$PROD_SUPABASE_URL"
            printf 'CORS_ALLOWED_ORIGINS=http://%s:3000\n' "$ORACLE_HOST"
            printf 'BACKEND_PORT=8080\n'
            printf 'FRONTEND_PORT=3000\n'
          } | ssh "$ORACLE_USER@$ORACLE_HOST" 'umask 077; cat > /opt/eventory/.env'

      - name: Log Oracle in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$ORACLE_USER@$ORACLE_HOST" "sudo docker login ghcr.io --username '$GHCR_USER' --password-stdin"

      - name: Pull and run production images
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" '
            set -eu
            cd /opt/eventory
            sudo docker compose --env-file .env -f docker-compose.yml pull
            sudo docker compose --env-file .env -f docker-compose.yml run --rm migrate
            sudo docker compose --env-file .env -f docker-compose.yml up -d --remove-orphans backend frontend
          '

      - name: Verify deployment
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PROD_API_URL/health"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "http://$ORACLE_HOST:3000/" > /dev/null
