name: CI and publish images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Cancel superseded PR runs, but never a running main run: cancelling a deploy
# halfway can leave production with a partially copied config.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what this run must do. Every image is tagged with a hash of its
  # inputs (scripts/image-tag.sh). On main, an image is built only if that tag
  # is missing from GHCR, so a failed build or deploy is retried by whatever
  # push comes next, even one that touches nothing but CI.
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
      build: ${{ steps.plan.outputs.build }}
      verify_backend: ${{ steps.plan.outputs.verify_backend }}
      verify_frontend: ${{ steps.plan.outputs.verify_frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          # PR runs check out the merge commit; HEAD^1 is the base branch.
          fetch-depth: 2

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and work to do
        id: plan
        env:
          # Every deployable image and the docker build context it builds from.
          SERVICES: |
            [
              {"service": "account", "context": "backend"},
              {"service": "tournament", "context": "backend"},
              {"service": "payment", "context": "backend"},
              {"service": "notification", "context": "backend"},
              {"service": "frontend", "context": "frontend"}
            ]
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          set -euo pipefail
          # Without this, set -e is off inside $(...): a failing image-tag.sh
          # would yield an empty tag instead of failing the job.
          shopt -s inherit_errexit
          # SERVICES plus each image's content tag and whether GHCR already has
          # it. Probing is the only side effect; everything below is derived
          # from this array with jq.
          plan=$(
            jq -c '.[]' <<<"$SERVICES" | while IFS= read -r entry; do
              service=$(jq -r .service <<<"$entry")
              context=$(jq -r .context <<<"$entry")
              tag=$(scripts/image-tag.sh "$context" "$service")
              published=false
              # Any failure (not found, auth, network) counts as missing: the
              # worst case is a needless rebuild, never a skipped one.
              if [ "$IS_MAIN_PUSH" = true ] \
                && docker manifest inspect "ghcr.io/moomaideng/eventory-$service:$tag" > /dev/null 2>&1; then
                published=true
              fi
              echo "$service: $tag published=$published" >&2
              jq -c --arg tag "$tag" --argjson published "$published" \
                '. + {tag: $tag, published: $published}' <<<"$entry"
            done | jq -s -c .
          )
          tags=$(jq -c 'map({(.service): .tag}) | add' <<<"$plan")
          # Only main publishes; there, build whatever the registry lacks.
          build=$(jq -c --argjson main "$IS_MAIN_PUSH" \
            'map(select($main and (.published | not)) | {service, context, tag})' <<<"$plan")
          verify_backend=$(jq 'any(.[]; .context == "backend")' <<<"$build")
          verify_frontend=$(jq 'any(.[]; .context == "frontend")' <<<"$build")
          # PRs verify whatever their full diff against the base touches.
          if [ "$IS_MAIN_PUSH" != true ]; then
            git diff --quiet HEAD^1 HEAD -- backend .github || verify_backend=true
            git diff --quiet HEAD^1 HEAD -- frontend .github || verify_frontend=true
          fi
          {
            echo "tags=$tags"
            echo "build=$build"
            echo "verify_backend=$verify_backend"
            echo "verify_frontend=$verify_frontend"
          } | tee -a "$GITHUB_OUTPUT"

  verify-backend:
    needs: plan
    if: needs.plan.outputs.verify_backend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # go test skips packages without test files (including every cmd/), so
      # go build ./... is what proves every service binary still compiles.
      - name: Test and build backend
        working-directory: backend
        run: |
          go test -v ./...
          go build ./...

  verify-frontend:
    needs: plan
    if: needs.plan.outputs.verify_frontend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run test:payments && npm run build

  publish:
    # Skipped verify jobs (nothing of theirs changed) must not block publish.
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.plan.outputs.build != '[]'
    needs: [plan, verify-backend, verify-frontend]
    runs-on: ubuntu-24.04-arm
    strategy:
      # A failed image blocks deploy anyway; let the others finish and push.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Matrix values cannot read secrets, so resolve per-image build args
      # here. Only the frontend gets the NEXT_PUBLIC_* values it bakes in.
      - name: Resolve build arguments
        id: args
        env:
          SERVICE: ${{ matrix.service }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          if [ "$SERVICE" != frontend ]; then
            printf 'value=SERVICE=%s\n' "$SERVICE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$PROD_SUPABASE_URL" || (echo "::error::Missing PROD_SUPABASE_URL" && exit 1)
          test -n "$PROD_SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Missing PROD_SUPABASE_PUBLISHABLE_KEY" && exit 1)
          test -n "$PROD_API_URL" || (echo "::error::Missing PROD_API_URL" && exit 1)
          {
            echo 'value<<BUILD_ARGS'
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$PROD_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$PROD_SUPABASE_PUBLISHABLE_KEY"
            printf 'NEXT_PUBLIC_API_URL=%s\n' "$PROD_API_URL"
            echo 'BUILD_ARGS'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/arm64
          push: true
          build-args: ${{ steps.args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ghcr.io/moomaideng/eventory-${{ matrix.service }}:${{ matrix.tag }}
            ghcr.io/moomaideng/eventory-${{ matrix.service }}:latest
            ghcr.io/moomaideng/eventory-${{ matrix.service }}:${{ github.sha }}

  deploy:
    # Runs on every main push, even when no image changed: config, .env and
    # retries of a previously failed deploy still need to land.
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [plan, verify-backend, verify-frontend, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_MONGO_PASSWORD: ${{ secrets.PROD_MONGO_PASSWORD }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_ACME_EMAIL: ${{ secrets.PROD_ACME_EMAIL }}
          PROD_PAYMENT_SERVICE_KEY: ${{ secrets.PROD_PAYMENT_SERVICE_KEY }}
          PROD_RABBITMQ_PASSWORD: ${{ secrets.PROD_RABBITMQ_PASSWORD }}
          PROD_SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
          PROD_SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
          PROD_SMTP_USERNAME: ${{ secrets.PROD_SMTP_USERNAME }}
          PROD_SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
          PROD_SMTP_FROM_ADDRESS: ${{ secrets.PROD_SMTP_FROM_ADDRESS }}
        run: |
          test -n "$ORACLE_HOST" || (echo "::error::Missing ORACLE_HOST" && exit 1)
          test -n "$ORACLE_USER" || (echo "::error::Missing ORACLE_USER" && exit 1)
          test -n "$ORACLE_SSH_KEY" || (echo "::error::Missing ORACLE_SSH_KEY" && exit 1)
          test -n "$ORACLE_KNOWN_HOSTS" || (echo "::error::Missing ORACLE_KNOWN_HOSTS" && exit 1)
          test -n "$PROD_POSTGRES_PASSWORD" || (echo "::error::Missing PROD_POSTGRES_PASSWORD" && exit 1)
          test -n "$PROD_MONGO_PASSWORD" || (echo "::error::Missing PROD_MONGO_PASSWORD" && exit 1)
          test -n "$PROD_API_URL" || (echo "::error::Missing PROD_API_URL" && exit 1)
          test -n "$PROD_ACME_EMAIL" || (echo "::error::Missing PROD_ACME_EMAIL" && exit 1)
          test "${#PROD_PAYMENT_SERVICE_KEY}" -ge 32 || (echo "::error::PROD_PAYMENT_SERVICE_KEY must contain at least 32 characters" && exit 1)
          test -n "$PROD_RABBITMQ_PASSWORD" || (echo "::error::Missing PROD_RABBITMQ_PASSWORD" && exit 1)
          test -n "$PROD_SMTP_HOST" || (echo "::error::Missing PROD_SMTP_HOST" && exit 1)
          test -n "$PROD_SMTP_PORT" || (echo "::error::Missing PROD_SMTP_PORT" && exit 1)
          test -n "$PROD_SMTP_USERNAME" || (echo "::error::Missing PROD_SMTP_USERNAME" && exit 1)
          test -n "$PROD_SMTP_PASSWORD" || (echo "::error::Missing PROD_SMTP_PASSWORD" && exit 1)
          test -n "$PROD_SMTP_FROM_ADDRESS" || (echo "::error::Missing PROD_SMTP_FROM_ADDRESS" && exit 1)

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy production Compose configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          # rsync --delete would do this in one step, but needs rsync on both
          # the runner and the Oracle host; rm + scp -r needs neither.
          ssh "$ORACLE_USER@$ORACLE_HOST" 'sudo install -d -m 0755 -o "$USER" -g "$(id -gn)" /opt/eventory /opt/eventory/docker && rm -rf /opt/eventory/docker'
          scp docker-compose.production.yml "$ORACLE_USER@$ORACLE_HOST:/opt/eventory/docker-compose.yml"
          scp -r docker "$ORACLE_USER@$ORACLE_HOST:/opt/eventory/docker"
          ssh "$ORACLE_USER@$ORACLE_HOST" 'chmod 755 /opt/eventory/docker/postgres/init-databases.sh'

      - name: Write production runtime environment
        env:
          IMAGE_TAGS: ${{ needs.plan.outputs.tags }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_MONGO_PASSWORD: ${{ secrets.PROD_MONGO_PASSWORD }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_ACME_EMAIL: ${{ secrets.PROD_ACME_EMAIL }}
          PROD_PAYMENT_SERVICE_KEY: ${{ secrets.PROD_PAYMENT_SERVICE_KEY }}
          PROD_RABBITMQ_PASSWORD: ${{ secrets.PROD_RABBITMQ_PASSWORD }}
          PROD_SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
          PROD_SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
          PROD_SMTP_USERNAME: ${{ secrets.PROD_SMTP_USERNAME }}
          PROD_SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
          PROD_SMTP_FROM_ADDRESS: ${{ secrets.PROD_SMTP_FROM_ADDRESS }}
          PROD_GRAFANA_PASSWORD: ${{ secrets.PROD_GRAFANA_PASSWORD }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          {
            jq -r '"ACCOUNT_IMAGE_TAG=\(.account)",
                   "TOURNAMENT_IMAGE_TAG=\(.tournament)",
                   "PAYMENT_IMAGE_TAG=\(.payment)",
                   "NOTIFICATION_IMAGE_TAG=\(.notification)",
                   "FRONTEND_IMAGE_TAG=\(.frontend)"' <<<"$IMAGE_TAGS"
            printf 'POSTGRES_PASSWORD=%s\n' "$PROD_POSTGRES_PASSWORD"
            printf 'MONGO_PASSWORD=%s\n' "$PROD_MONGO_PASSWORD"
            printf 'SUPABASE_URL=%s\n' "$PROD_SUPABASE_URL"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$PROD_API_URL"
            printf 'ACME_EMAIL=%s\n' "$PROD_ACME_EMAIL"
            printf 'PAYMENT_SERVICE_KEY=%s\n' "$PROD_PAYMENT_SERVICE_KEY"
            printf 'RABBITMQ_PASSWORD=%s\n' "$PROD_RABBITMQ_PASSWORD"
            printf 'SMTP_HOST=%s\n' "$PROD_SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "$PROD_SMTP_PORT"
            printf 'SMTP_USERNAME=%s\n' "$PROD_SMTP_USERNAME"
            printf 'SMTP_PASSWORD=%s\n' "$PROD_SMTP_PASSWORD"
            printf 'SMTP_FROM_ADDRESS=%s\n' "$PROD_SMTP_FROM_ADDRESS"
            printf 'PUBLIC_WEB_URL=%s\n' "$PROD_API_URL"
            printf 'GRAFANA_PASSWORD=%s\n' "$PROD_GRAFANA_PASSWORD"
          } | ssh "$ORACLE_USER@$ORACLE_HOST" 'umask 077; cat > /opt/eventory/.env'

      - name: Log Oracle in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$ORACLE_USER@$ORACLE_HOST" "sudo docker login ghcr.io --username '$GHCR_USER' --password-stdin"

      - name: Pull and run production images
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" '
            set -eu
            cd /opt/eventory
            sudo docker compose --env-file .env -f docker-compose.yml pull
            sudo docker compose --env-file .env -f docker-compose.yml up -d --wait postgres mongodb rabbitmq
            sudo docker compose --env-file .env -f docker-compose.yml exec -T postgres bash /docker-entrypoint-initdb.d/01-init-databases.sh
            sudo docker compose --env-file .env -f docker-compose.yml run --rm account-migrate
            sudo docker compose --env-file .env -f docker-compose.yml run --rm tournament-migrate
            sudo docker compose --env-file .env -f docker-compose.yml run --rm payment-migrate
            sudo docker compose --env-file .env -f docker-compose.yml run --rm notification-migrate
            # --wait fails the deploy if a container exits or turns unhealthy,
            # instead of reporting success while e.g. Grafana crash-loops.
            sudo docker compose --env-file .env -f docker-compose.yml up -d --wait --wait-timeout 300 --remove-orphans postgres mongodb rabbitmq account tournament payment notification traefik frontend loki tempo alloy grafana
          '

      - name: Verify deployment
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PROD_API_URL/health"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PROD_API_URL/" > /dev/null
