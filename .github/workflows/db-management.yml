name: Database Management (Production)

on:
  workflow_dispatch:
    inputs:
      reset_all:
        description: 'FULL RESET: wipe Postgres, MongoDB and RabbitMQ queues, then re-migrate. Off = migrations only.'
        type: boolean
        default: false
      confirm:
        description: 'Type "reset" to confirm a full reset (ignored when reset_all is off)'
        type: string
        default: ''
      seed_data:
        description: 'Seed mock data (tournaments & accounts)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  db-ops:
    name: Run Database Operations
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation for a full reset
        if: ${{ github.event.inputs.reset_all == 'true' }}
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "reset" ]; then
            echo 'A full reset deletes all production data. Re-run with confirm set to "reset".'
            exit 1
          fi

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute database commands on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          RESET_ALL: ${{ github.event.inputs.reset_all }}
          SEED_DATA: ${{ github.event.inputs.seed_data }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" "
            set -eu
            cd /opt/eventory

            echo '==> Starting Postgres, MongoDB and RabbitMQ...'
            sudo docker compose --env-file .env -f docker-compose.yml up -d --wait postgres mongodb rabbitmq
            sudo docker compose --env-file .env -f docker-compose.yml exec -T postgres bash /docker-entrypoint-initdb.d/01-init-databases.sh

            if [ '$RESET_ALL' = 'true' ]; then
              echo '==> Stopping backend services before dropping schemas...'
              sudo docker compose --env-file .env -f docker-compose.yml stop account tournament payment notification

              echo '==> Dropping MongoDB tournament_db (registration forms and answers)...'
              sudo docker compose --env-file .env -f docker-compose.yml exec -T mongodb sh -c 'mongosh --quiet -u \"\$MONGO_INITDB_ROOT_USERNAME\" -p \"\$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin tournament_db --eval \"db.dropDatabase()\"'

              echo '==> Purging RabbitMQ queues (queues and bindings are kept)...'
              sudo docker compose --env-file .env -f docker-compose.yml exec -T rabbitmq su-exec rabbitmq sh -c 'rabbitmqctl list_queues -q --no-table-headers name | while read -r q; do rabbitmqctl purge_queue \"\$q\" </dev/null || exit 1; done'

              echo '==> Resetting service database schemas and migrating...'
              sudo docker compose --env-file .env -f docker-compose.yml run --rm account-migrate ./migrate -reset
              sudo docker compose --env-file .env -f docker-compose.yml run --rm tournament-migrate ./migrate -reset
              sudo docker compose --env-file .env -f docker-compose.yml run --rm payment-migrate ./migrate -reset
              sudo docker compose --env-file .env -f docker-compose.yml run --rm notification-migrate ./migrate -reset
            else
              echo '==> Running service migrations...'
              sudo docker compose --env-file .env -f docker-compose.yml run --rm account-migrate
              sudo docker compose --env-file .env -f docker-compose.yml run --rm tournament-migrate
              sudo docker compose --env-file .env -f docker-compose.yml run --rm payment-migrate
              sudo docker compose --env-file .env -f docker-compose.yml run --rm notification-migrate
            fi

            if [ '$SEED_DATA' = 'true' ]; then
              echo '==> Seeding mock data (account and tournament)...'
              sudo docker compose --env-file .env -f docker-compose.yml run --rm account-migrate ./seed
              sudo docker compose --env-file .env -f docker-compose.yml run --rm tournament-migrate ./seed
            fi

            echo '==> Starting backend services...'
            sudo docker compose --env-file .env -f docker-compose.yml up -d account tournament payment notification

            echo '==> Database operation completed successfully!'
          "
