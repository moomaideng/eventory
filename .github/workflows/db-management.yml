name: Database Management (Production)

on:
  workflow_dispatch:
    inputs:
      reset_db:
        description: 'Reset database schema (DROP public CASCADE & re-migrate)'
        type: boolean
        default: true
      seed_data:
        description: 'Seed mock data (tournaments & accounts)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  db-ops:
    name: Run Database Operations
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute database commands on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          RESET_DB: ${{ github.event.inputs.reset_db }}
          SEED_DATA: ${{ github.event.inputs.seed_data }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" "
            set -eu
            cd /opt/eventory

            echo '==> Starting Postgres...'
            sudo docker compose --env-file .env -f docker-compose.yml up -d --wait postgres

            if [ '$RESET_DB' = 'true' ]; then
              echo '==> Stopping backend services (account and tournament) before dropping schemas...'
              sudo docker compose --env-file .env -f docker-compose.yml stop account tournament

              echo '==> Resetting database schemas (account_db and tournament_db) and migrating...'
              sudo docker compose --env-file .env -f docker-compose.yml run --rm account-migrate ./migrate -reset
              sudo docker compose --env-file .env -f docker-compose.yml run --rm tournament-migrate ./migrate -reset
            else
              echo '==> Running migrations (account and tournament)...'
              sudo docker compose --env-file .env -f docker-compose.yml run --rm account-migrate
              sudo docker compose --env-file .env -f docker-compose.yml run --rm tournament-migrate
            fi

            if [ '$SEED_DATA' = 'true' ]; then
              echo '==> Seeding mock data (account and tournament)...'
              sudo docker compose --env-file .env -f docker-compose.yml run --rm account-migrate ./seed
              sudo docker compose --env-file .env -f docker-compose.yml run --rm tournament-migrate ./seed
            fi

            echo '==> Starting backend services (account and tournament)...'
            sudo docker compose --env-file .env -f docker-compose.yml up -d account tournament

            echo '==> Database operation completed successfully!'
          "
