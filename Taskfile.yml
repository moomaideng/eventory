# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  COMPOSE_APPS: docker compose --profile infra --profile apps
  COMPOSE_WEB: docker compose --profile infra --profile apps --profile web
  COMPOSE_OBS: docker compose --profile infra --profile apps --profile obs
  COMPOSE_ALL: docker compose --profile infra --profile apps --profile web --profile obs

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # --- Day-to-day ---

  dev:
    desc: Migrate, start infra+apps, run Next.js on the host
    deps: [build]
    cmds:
      - task: migrate
      - "{{.COMPOSE_APPS}} up -d"
      - task: frontend

  dev:backend:
    desc: Migrate and start infra+apps (no frontend)
    deps: [build]
    cmds:
      - task: migrate
      - "{{.COMPOSE_APPS}} up -d"

  dev:obs:
    desc: Migrate and start infra+apps+observability (Grafana at /grafana)
    deps: [build]
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      TRAEFIK_TRACING: "true"
    cmds:
      - task: migrate
      - "{{.COMPOSE_OBS}} up -d"

  dev:docker:
    desc: Migrate and start infra+apps+frontend container
    deps: [build]
    cmds:
      - task: migrate
      - "{{.COMPOSE_WEB}} up -d"

  logs:
    desc: Follow account, tournament, and payment logs
    cmds:
      - "{{.COMPOSE_APPS}} logs -f account tournament payment"

  down:
    desc: Stop the Compose stack
    cmds:
      - "{{.COMPOSE_ALL}} down --remove-orphans"

  # --- Backend data ---

  migrate:
    desc: Ensure Postgres is up, create DBs, run service migrations
    deps: [build]
    cmds:
      - "{{.COMPOSE_APPS}} up -d --wait postgres"
      - "{{.COMPOSE_APPS}} exec -T postgres bash /docker-entrypoint-initdb.d/01-init-databases.sh"
      - "{{.COMPOSE_APPS}} up -d --force-recreate account-migrate tournament-migrate payment-migrate notification-migrate"
      - "{{.COMPOSE_APPS}} wait account-migrate tournament-migrate payment-migrate notification-migrate"

  seed:
    desc: Seed sample accounts, tournaments and mock payments (apps must already be up)
    cmds:
      - go -C backend run ./services/account/cmd/seed
      - go -C backend run ./services/tournament/cmd/seed
      - go -C backend run ./services/payment/cmd/seed
      - go -C backend run ./services/notification/cmd/seed

  db:reset:
    desc: Stop the stack and delete the local Postgres, MongoDB, RabbitMQ, Loki, Tempo, and Grafana volumes
    cmds:
      - "{{.COMPOSE_ALL}} down --remove-orphans"
      - docker volume rm -f eventory_postgres_data eventory_mongo_data eventory_rabbitmq_data eventory_loki_data eventory_tempo_data eventory_grafana_data

  # --- Tooling ---

  notification:smoke:
    desc: Publish a sample registration.submitted event and inspect it in Mailpit on port 8025
    cmds:
      - go -C backend run ./services/notification/cmd/publish-registration-submitted

  build:
    desc: Rebuild Compose images when Dockerfiles change
    sources:
      - backend/docker/**
      - backend/Dockerfile
      - frontend/Dockerfile
    generates:
      - .cache/compose-build.stamp
    cmds:
      - "{{.COMPOSE_ALL}} build"
      - mkdir -p .cache
      - touch .cache/compose-build.stamp

  frontend:
    desc: Install frontend deps if needed and run Next.js on the host
    deps: [frontend:install]
    cmds:
      - npm --prefix frontend run dev

  frontend:install:
    desc: Install frontend deps when package-lock changes
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.install-stamp
    cmds:
      - npm ci --no-fund --no-audit
      - cp package-lock.json node_modules/.install-stamp

  gen-proto:
    desc: Lint and regenerate gRPC code
    dir: backend
    cmds:
      - buf lint
      - buf generate

  test:
    desc: Run backend tests and frontend lint and typecheck
    cmds:
      - go -C backend test ./...
      - npm --prefix frontend run lint
      - npm --prefix frontend run typecheck
      - npm --prefix frontend run test:payments
