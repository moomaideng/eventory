#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
cmd = "CGO_ENABLED=0 go build -o ./tmp/$SERVICE ./services/$SERVICE/cmd/api"
bin = "./tmp/$SERVICE"
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "proto"]
include_dir = ["services/$SERVICE", "internal"]
exclude_dir = [
  "tmp",
  "vendor",
  "bruno",
  "docs",
  ".git",
  "docker",
  "node_modules",
  "tests",
]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true
kill_delay = "500ms"

[log]
time = false

[misc]
clean_on_exit = true
