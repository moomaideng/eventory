syntax = "proto3";

package account.v1;

option go_package = "github.com/moomaideng/eventory/services/account/pkg/proto/account/v1;accountv1";

service AccountService {
  rpc BatchGetAccounts(BatchGetAccountsRequest) returns (BatchGetAccountsResponse);
  rpc BatchGetOrganizerProfiles(BatchGetOrganizerProfilesRequest) returns (BatchGetOrganizerProfilesResponse);
  rpc GetOrganizerProfileByAccountID(GetOrganizerProfileByAccountIDRequest) returns (GetOrganizerProfileByAccountIDResponse);
  rpc BatchGetSponsorProfiles(BatchGetSponsorProfilesRequest) returns (BatchGetSponsorProfilesResponse);
  rpc GetSponsorProfileByAccountID(GetSponsorProfileByAccountIDRequest) returns (GetSponsorProfileByAccountIDResponse);
  rpc GetAccountByHandle(GetAccountByHandleRequest) returns (GetAccountByHandleResponse);
}

message Account {
  string id = 1;
  string handle = 2;
  string display_name = 3;
  string status = 4;
  string email = 5;
}

message OrganizerProfile {
  string account_id = 1;
  string organizer_name = 2;
}

message SponsorProfile {
  string account_id = 1;
  string sponsor_name = 2;
  string website_url = 3;
  string logo_url = 4;
}

message BatchGetAccountsRequest {
  repeated string account_ids = 1;
}

message BatchGetAccountsResponse {
  repeated Account accounts = 1;
  repeated string not_found_ids = 2;
}

message BatchGetOrganizerProfilesRequest {
  repeated string organizer_profile_ids = 1;
}

message BatchGetOrganizerProfilesResponse {
  repeated OrganizerProfile profiles = 1;
  repeated string not_found_ids = 2;
}

message GetOrganizerProfileByAccountIDRequest {
  string account_id = 1;
}

message GetOrganizerProfileByAccountIDResponse {
  OrganizerProfile profile = 1;
}

message BatchGetSponsorProfilesRequest {
  repeated string sponsor_profile_ids = 1;
}

message BatchGetSponsorProfilesResponse {
  repeated SponsorProfile profiles = 1;
  repeated string not_found_ids = 2;
}

message GetSponsorProfileByAccountIDRequest {
  string account_id = 1;
}

message GetSponsorProfileByAccountIDResponse {
  SponsorProfile profile = 1;
}

message GetAccountByHandleRequest {
  string handle = 1;
}

message GetAccountByHandleResponse {
  Account account = 1;
}
